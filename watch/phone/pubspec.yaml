name: voice_counter
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.6.6
  permission_handler: ^11.3.1
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  porcupine_flutter: ^4.0.0
  flutter_tts: ^4.2.3
  shared_preferences: ^2.5.3
  flutter_dotenv: ^6.0.0
  flutter_foreground_task: ^8.11.0

  hive: ^2.2.3
  hive_flutter: ^1.1.0

  glassmorphism: ^3.0.0
  shimmer: ^3.0.0
  confetti: ^0.7.0
  lottie: ^3.0.0

  settings_ui: ^2.0.2
  flex_color_picker: ^3.4.1
  uuid: ^4.5.1
  wear: ^1.1.0

  # Audio Playback for Hype Feature
  audioplayers: ^6.1.0
  path_provider: ^2.1.4

  # Keep screen on while scoring
  wakelock_plus: ^1.2.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/models/red-point_en_android_v4_0_0.ppn
    - assets/models/blue-point_en_android_v4_0_0.ppn
    - assets/models/picovoice_android.ppn
    - assets/models/meow-meow_en_android_v4_0_0.ppn
    - assets/audio/hype/
    - assets/audio/music/
    - assets/config/hype_voice_config.json
    - assets/image/
