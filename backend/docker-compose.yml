# Backend trên Dokploy (home server). Deploy: Dokploy → Compose → repo badminton-system,
# Compose Path = backend/docker-compose.yml. Biến ${...} đặt ở tab Environment của Dokploy.
# Domain gắn ở tab Domains (service crawler, port 8000) — xem backend/README.md.
services:
  crawler:
    build: ./crawler
    restart: unless-stopped
    environment:
      TZ: Asia/Ho_Chi_Minh
      CONFIG_PATH: /app/data/config.json
      # Sau Traefik mọi request mang IP overlay của proxy (10.0.x) → KHÔNG được tin, nếu không
      # người ngoài bị coi là "máy nhà" và bỏ qua token. Chỉ tin container + PC qua WireGuard
      # (10.8.0.3). Đừng thêm cả dải 10.8.0.0/24: Linode (relay) cũng nằm trong đó.
      TRUSTED_NETS: ${TRUSTED_NETS:-127.0.0.1/32,10.8.0.3/32}
      # Playwright server dùng chung (container chromium trong dokploy-network)
      PLAYWRIGHT_WS: ${PLAYWRIGHT_WS:-ws://jinerproject-chromium-bzuzgh-chromium-1:3000/}
      ALOBO_KEY: ${ALOBO_KEY:?đặt ALOBO_KEY trong Environment của Dokploy}
      PROD_KEY: ${PROD_KEY:-}
      PUSH_URL: ${PUSH_URL:-}
      PUSH_TOKEN: ${PUSH_TOKEN:-}
      TRIGGER_TOKEN: ${TRIGGER_TOKEN:-}
    volumes:
      - crawler-data:/app/data # dữ liệu cào + config.json + log, giữ qua redeploy
    expose:
      - "8000" # Traefik (domain) vào cổng này qua dokploy-network
    ports:
      # Cổng quản trị cho máy nhà: http://10.8.0.4:8001 qua WireGuard (đổi danh sách sân,
      # cào không cần token). Ai khác tới được cổng này (LAN, …) mà không nằm trong
      # TRUSTED_NETS thì quyền y như qua domain công khai: chỉ xem + kích cào có token.
      - "8001:8000"
    networks:
      - dokploy-network

  # API nhỏ trên SQLite: danh bạ người chơi (nguồn chung), lịch sử trận, ranking,
  # gợi ý xoay người. id người chơi = id GỐC sổ tiền. Không dính ALOBO.
  api:
    build: ./api
    restart: unless-stopped
    environment:
      TZ: Asia/Ho_Chi_Minh
      DB_PATH: /app/data/badminton.db
      # Chỉ tin container + PC qua WireGuard (xem ghi chú ở service crawler).
      TRUSTED_NETS: ${TRUSTED_NETS:-127.0.0.1/32,10.8.0.3/32}
      # Ghi từ internet (Flutter) phải kèm Bearer token này.
      API_TOKEN: ${API_TOKEN:-}
      # Kéo danh bạ từ sổ tiền (Blob) lúc DB rỗng + khi gọi /api/roster/reseed.
      BILLBOOK_URL: ${BILLBOOK_URL:-}
      # Đẩy mirror danh bạ lên Blob để web/Flutter đọc luôn-online.
      ROSTER_PUSH_URL: ${ROSTER_PUSH_URL:-}
      ROSTER_PUSH_TOKEN: ${ROSTER_PUSH_TOKEN:-}
      # Cổng Sân trống: proxy sang service crawler (cùng network). Token để kích cào,
      # ADMIN_PASS (= mật khẩu sổ) để gate đổi cấu hình / kích cào từ web.
      CRAWLER_URL: ${CRAWLER_URL:-http://crawler:8000}
      CRAWLER_TOKEN: ${CRAWLER_TOKEN:-}
      ADMIN_PASS: ${ADMIN_PASS:-}
    volumes:
      - api-data:/app/data # badminton.db, giữ qua redeploy
    expose:
      - "8000"
    ports:
      - "8002:8000" # quản trị qua WireGuard: http://10.8.0.4:8002
    networks:
      - dokploy-network

volumes:
  crawler-data:
  api-data:

networks:
  dokploy-network:
    external: true
